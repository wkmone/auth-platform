server:
  port: 9000

spring:
  application:
    name: gateway
  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/oauth2/**, /.well-known/**, /userinfo, /login, /oauth2/consent
        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/api/users/**, /api/roles/**, /api/permissions/**
        - id: app-service
          uri: lb://app-service
          predicates:
            - Path=/api/apps/**
        - id: audit-service
          uri: lb://audit-service
          predicates:
            - Path=/api/audit/**
        - id: notification-service
          uri: lb://notification-service
          predicates:
            - Path=/api/notifications/**
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:localhost:8848}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379
auth:
  service:
    url: http://localhost:9001
