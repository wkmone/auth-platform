version: '3.8'
services:
  # === Infrastructure ===
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: auth_user
      POSTGRES_PASSWORD: auth_pass
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth_user"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  nacos:
    image: nacos/nacos-server:v2.3.1
    environment:
      MODE: standalone
    ports:
      - "8848:8848"
      - "9848:9848"

  # === Microservices ===
  auth-service:
    build:
      context: ../services/auth-service
      dockerfile: ../../docker/Dockerfile
    ports:
      - "9001:9001"
    environment:
      DB_USERNAME: auth_user
      DB_PASSWORD: auth_pass
      REDIS_HOST: redis
      RABBITMQ_HOST: rabbitmq
      NACOS_ADDR: nacos:8848
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/auth_db
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  user-service:
    build:
      context: ../services/user-service
      dockerfile: ../../docker/Dockerfile
    ports:
      - "9002:9002"
    environment:
      DB_USERNAME: auth_user
      DB_PASSWORD: auth_pass
      RABBITMQ_HOST: rabbitmq
      NACOS_ADDR: nacos:8848
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/user_db
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  app-service:
    build:
      context: ../services/app-service
      dockerfile: ../../docker/Dockerfile
    ports:
      - "9003:9003"
    environment:
      DB_USERNAME: auth_user
      DB_PASSWORD: auth_pass
      RABBITMQ_HOST: rabbitmq
      NACOS_ADDR: nacos:8848
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/app_db
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  audit-service:
    build:
      context: ../services/audit-service
      dockerfile: ../../docker/Dockerfile
    ports:
      - "9004:9004"
    environment:
      DB_USERNAME: auth_user
      DB_PASSWORD: auth_pass
      RABBITMQ_HOST: rabbitmq
      NACOS_ADDR: nacos:8848
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/audit_db
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  notification-service:
    build:
      context: ../services/notification-service
      dockerfile: ../../docker/Dockerfile
    ports:
      - "9005:9005"
    environment:
      DB_USERNAME: auth_user
      DB_PASSWORD: auth_pass
      RABBITMQ_HOST: rabbitmq
      NACOS_ADDR: nacos:8848
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/notification_db
      SMTP_HOST: mailhog
      SMTP_PORT: "1025"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  gateway:
    build:
      context: ../services/gateway
      dockerfile: ../../docker/Dockerfile
    ports:
      - "9000:9000"
    environment:
      REDIS_HOST: redis
      NACOS_ADDR: nacos:8848
      AUTH_SERVICE_URL: http://auth-service:9001
    depends_on:
      - redis
      - auth-service

  # === Frontend ===
  frontend-login:
    build:
      context: ../frontend/login-app
      dockerfile: ../../docker/Dockerfile.frontend
    ports:
      - "3001:80"
    depends_on:
      - gateway

  frontend-admin:
    build:
      context: ../frontend/admin-app
      dockerfile: ../../docker/Dockerfile.frontend
    ports:
      - "3000:80"
    depends_on:
      - gateway

  # === Dev mail catcher ===
  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  pgdata:
  redisdata:
